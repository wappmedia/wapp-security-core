name: Canonical Release Matrix

on:
  pull_request:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  canonical:
    name: ${{ matrix.os }} / public-core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Provision exact native build toolchain
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}:${RUNNER_ARCH}" in
            Linux:X64)
              archive="zig-x86_64-linux-0.15.2.tar.xz"
              expected="02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239"
              directory="zig-x86_64-linux-0.15.2"
              ;;
            macOS:ARM64)
              archive="zig-aarch64-macos-0.15.2.tar.xz"
              expected="3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b"
              directory="zig-aarch64-macos-0.15.2"
              ;;
            macOS:X64)
              archive="zig-x86_64-macos-0.15.2.tar.xz"
              expected="375b6909fc1495d16fc2c7db9538f707456bfc3373b14ee83fdd3e22b3d43f7f"
              directory="zig-x86_64-macos-0.15.2"
              ;;
            *) printf 'Unsupported canonical native build runner: %s:%s\n' "$RUNNER_OS" "$RUNNER_ARCH" >&2;exit 1;;
          esac
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://ziglang.org/download/0.15.2/${archive}" -o "$RUNNER_TEMP/$archive"
          actual="$(shasum -a 256 "$RUNNER_TEMP/$archive"|awk '{print $1}')"
          test "$actual" = "$expected"
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/$archive"
          zig="$RUNNER_TEMP/$directory/zig"
          test -f "$zig" -a ! -L "$zig" -a -x "$zig"
          test "$($zig version)" = 0.15.2
          printf 'WAPP_ZIG_BIN=%s\n' "$zig" >> "$GITHUB_ENV"
      - name: Canonical public release gate
        shell: bash
        run: /bin/bash bin/wapp-release-check
